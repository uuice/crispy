<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>浏览器不受支持</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #111;
        color: #eee;
        padding: 2rem;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #aaa;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前浏览器不受支持</h1>
      <p>本站不支持 Internet Explorer，请使用 Chrome、Edge、Firefox 或 Safari 等现代浏览器访问。</p>
    </main>
  </body>
</html>
