<style>
  .particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
    background: transparent;
    transition: background 0.3s;
  }
  body.dark .particle-canvas {
    /* 暗黑模式下粒子颜色可调整 */
    background: transparent;
  }
</style>

<canvas id="particle-canvas" class="particle-canvas"></canvas>

<script>
  // 粒子参数
  const PARTICLE_NUM = 50
  // 亮色模式：深色粒子，适中透明度
  const PARTICLE_COLOR_LIGHT = 'rgba(149,165,255,0.45)'
  const LINE_COLOR_LIGHT = 'rgba(149,165,255,0.20)'
  // 暗黑模式：亮色粒子，较高透明度
  const PARTICLE_COLOR_DARK = 'rgba(149,165,255,0.45)'
  const LINE_COLOR_DARK = 'rgba(149,165,255,0.20)'
  const PARTICLE_RADIUS = 3
  const LINE_DISTANCE = 150

  const canvas = document.getElementById('particle-canvas')
  const ctx = canvas.getContext('2d')
  let particles = []

  function resizeCanvas() {
    canvas.width = window.innerWidth
    canvas.height = window.innerHeight
  }
  resizeCanvas()
  window.addEventListener('resize', resizeCanvas)

  function getMode() {
    // 检查 documentElement 是否有 dark class
    return document.documentElement.classList.contains('dark') ? 'dark' : 'light'
  }

  function getParticleColor() {
    return getMode() === 'dark' ? PARTICLE_COLOR_DARK : PARTICLE_COLOR_LIGHT
  }
  function getLineColor() {
    return getMode() === 'dark' ? LINE_COLOR_DARK : LINE_COLOR_LIGHT
  }

  function Particle() {
    this.x = Math.random() * canvas.width
    this.y = Math.random() * canvas.height
    this.vx = (Math.random() - 0.5) * 0.8
    this.vy = (Math.random() - 0.5) * 0.8
  }

  Particle.prototype.draw = function () {
    ctx.beginPath()
    ctx.arc(this.x, this.y, PARTICLE_RADIUS, 0, Math.PI * 2)
    ctx.fillStyle = getParticleColor()
    ctx.fill()
  }

  Particle.prototype.move = function () {
    this.x += this.vx
    this.y += this.vy
    if (this.x < 0 || this.x > canvas.width) this.vx *= -1
    if (this.y < 0 || this.y > canvas.height) this.vy *= -1
  }

  function drawLines() {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        let dx = particles[i].x - particles[j].x
        let dy = particles[i].y - particles[j].y
        let dist = Math.sqrt(dx * dx + dy * dy)
        if (dist < LINE_DISTANCE) {
          ctx.beginPath()
          ctx.moveTo(particles[i].x, particles[i].y)
          ctx.lineTo(particles[j].x, particles[j].y)
          ctx.strokeStyle = getLineColor()
          ctx.lineWidth = 1
          ctx.stroke()
        }
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    for (let p of particles) {
      p.move()
      p.draw()
    }
    drawLines()
    requestAnimationFrame(animate)
  }

  function initParticles() {
    particles = []
    for (let i = 0; i < PARTICLE_NUM; i++) {
      particles.push(new Particle())
    }
  }

  // 监听暗黑模式切换
  const observer = new MutationObserver(() => {
    // 重新渲染时自动切换颜色
  })
  observer.observe(document.body, { attributes: true, attributeFilter: ['class'] })

  initParticles()
  animate()
</script>
